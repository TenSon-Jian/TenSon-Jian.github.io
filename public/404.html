<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>正在跳转 — AJIAN</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f5f0;
        color: #625c52;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-size: 14px;
      }
    </style>

    <!--
      GitHub Pages 的 SPA 深链支持。

      /projects/xxx 这类地址在静态服务器上并不存在，GitHub Pages 会返回本页（404）。
      这里把「应用内部路由」搬到 ?p= 参数并跳回站点根目录，再由 index.html 里的还原脚本
      用 history.replaceState 改写回真实路径。

      __BASE_PATH__ 会被 vite.config.ts 的 injectSiteMeta 插件替换成实际 base
      （用户站点为 '/'，项目页为 '/<repo>/'），与 vue-router 的 BASE_URL 保持一致。
      之所以不在运行时"猜"部署形态：/projects/rms 与项目站点的 /projects/... 在 URL 上
      完全无法区分，只能靠构建期注入。
    -->
    <script>
      ;(function () {
        var base = '__BASE_PATH__'
        var pathname = location.pathname

        // 未经过构建（直接打开源码）时占位符仍在，退化为根路径
        if (base.indexOf('__BASE_PATH__') !== -1) base = '/'
        if (base.charAt(0) !== '/') base = '/' + base
        if (base.charAt(base.length - 1) !== '/') base += '/'

        // 剥掉 base 前缀，?p= 里只保留应用内部路由。
        // 注意 /my-blog（无尾斜杠）也要视为根路径，否则会切出不存在的 /my-blog。
        var rest = pathname
        if (base !== '/') {
          var bare = base.slice(0, -1)
          if (pathname === bare) {
            rest = '/'
          } else if (pathname.indexOf(base) === 0) {
            rest = '/' + pathname.slice(base.length)
          }
        }

        var query = location.search ? location.search.replace(/^\?/, '&') : ''
        location.replace(base + '?p=' + encodeURIComponent(rest) + query + location.hash)
      })()
    </script>
  </head>
  <body>
    <main>正在跳转…</main>
  </body>
</html>
