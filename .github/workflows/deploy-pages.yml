name: Deploy to GitHub Pages

# 发布到 TenSon-Jian.github.io（用户站点，base = /，因此无需设置 vite 的 base）
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只保留一次部署；排队中的旧任务直接取消，但不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # 仓库 Secrets 里配置后，构建期快照会抓真实数据：
        #   VITE_GITHUB_USERNAME  目标账号（不配则用代码里的默认值）
        #   SNAPSHOT_TOKEN        可选 PAT，仅用于提升抓取成功率（5000 次/小时）
        # 都不配也能构建：快照抓不到时会退回内置回退数据，不影响发布。
        # VITE_SITE_URL 取自仓库 Variables，用于生成 canonical / og:url；
        # 未配置时回退到 vite.config.ts 里的默认值 https://tenson-jian.github.io
        env:
          VITE_GITHUB_USERNAME: ${{ secrets.VITE_GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
